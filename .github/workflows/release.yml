name: Release

on:
  release:
    types: [published, edited]
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: unifi-ipv6-check-linux-x64
            use-cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: unifi-ipv6-check-linux-arm64
            use-cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: unifi-ipv6-check-windows-x64.exe
            use-cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: unifi-ipv6-check-windows-arm64.exe
            use-cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            name: unifi-ipv6-check-macos-x64
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            name: unifi-ipv6-check-macos-arm64
            use-cross: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      if: matrix.use-cross
      run: cargo install cross

    - name: Build
      if: matrix.use-cross == false
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build with cross
      if: matrix.use-cross
      run: cross build --release --target ${{ matrix.target }}

    - name: Rename and move artifact (Unix)
      if: matrix.os != 'windows-latest'
      run: mv target/${{ matrix.target }}/release/unifi-ipv6-check ${{ matrix.name }}

    - name: Rename and move artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: move target\${{ matrix.target }}\release\unifi-ipv6-check.exe ${{ matrix.name }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: ${{ matrix.name }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ matrix.name }}

  build-docker:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux x64 binary
        uses: actions/download-artifact@v4
        with:
          name: unifi-ipv6-check-linux-x64
          path: bin-dl/x64

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: unifi-ipv6-check-linux-arm64
          path: bin-dl/arm64

      - name: Prepare binaries for Docker build
        run: |
          mkdir -p bin
          cp bin-dl/x64/unifi-ipv6-check-linux-x64 bin/unifi-ipv6-check-amd64
          cp bin-dl/arm64/unifi-ipv6-check-linux-arm64 bin/unifi-ipv6-check-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
